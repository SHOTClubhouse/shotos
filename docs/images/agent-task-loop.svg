<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One agent task, the SHOTos way</title>
  <desc id="d">Six steps for every agent task: route the work, agree acceptance, do the work, read back the real result, review sized to risk, then record checkable claims for a person to accept. External actions wait for a named person's yes.</desc>
  <rect width="960" height="360" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">One agent task, the SHOTos way</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <g font-size="13" text-anchor="middle">
    <g transform="translate(20,80)"><rect width="140" height="130" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
      <text x="70" y="30" font-size="22" font-weight="800" fill="#374151">1</text><text x="70" y="56" font-weight="700" fill="#111827">Route</text>
      <text x="70" y="80" fill="#374151">asset, job, risk,</text><text x="70" y="98" fill="#374151">reader, route, proof</text></g>
    <g transform="translate(176,80)"><rect width="140" height="130" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
      <text x="70" y="30" font-size="22" font-weight="800" fill="#6d28d9">2</text><text x="70" y="56" font-weight="700" fill="#111827">Agree</text>
      <text x="70" y="80" fill="#374151">owner, checks,</text><text x="70" y="98" fill="#374151">one case that fails</text></g>
    <g transform="translate(332,80)"><rect width="140" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
      <text x="70" y="30" font-size="22" font-weight="800" fill="#15803d">3</text><text x="70" y="56" font-weight="700" fill="#111827">Do</text>
      <text x="70" y="80" fill="#374151">smallest real slice,</text><text x="70" y="98" fill="#374151">drafts for outside</text></g>
    <g transform="translate(488,80)"><rect width="140" height="130" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
      <text x="70" y="30" font-size="22" font-weight="800" fill="#0369a1">4</text><text x="70" y="56" font-weight="700" fill="#111827">Read back</text>
      <text x="70" y="80" fill="#374151">open the file, run</text><text x="70" y="98" fill="#374151">the test, see the page</text></g>
    <g transform="translate(644,80)"><rect width="140" height="130" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
      <text x="70" y="30" font-size="22" font-weight="800" fill="#b45309">5</text><text x="70" y="56" font-weight="700" fill="#111827">Review</text>
      <text x="70" y="80" fill="#374151">sized to risk; another</text><text x="70" y="98" fill="#374151">model for high risk</text></g>
    <g transform="translate(800,80)"><rect width="140" height="130" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
      <text x="70" y="30" font-size="22" font-weight="800" fill="#b91c1c">6</text><text x="70" y="56" font-weight="700" fill="#111827">Record</text>
      <text x="70" y="80" fill="#374151">checkable claims;</text><text x="70" y="98" fill="#374151">a person accepts</text></g>
  </g>
  <g stroke="#6b7280" stroke-width="2" marker-end="url(#a)">
    <line x1="160" y1="145" x2="174" y2="145"/><line x1="316" y1="145" x2="330" y2="145"/><line x1="472" y1="145" x2="486" y2="145"/>
    <line x1="628" y1="145" x2="642" y2="145"/><line x1="784" y1="145" x2="798" y2="145"/>
  </g>
  <rect x="20" y="240" width="920" height="92" rx="12" fill="#111827"/>
  <text x="480" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Send, post, spend, delete, publish or deploy?</text>
  <text x="480" y="298" text-anchor="middle" font-size="14" fill="#f9fafb">The agent stops and asks a named person. Bulk actions go through a frozen approval manifest.</text>
  <text x="480" y="320" text-anchor="middle" font-size="12" fill="#9ca3af">Autonomy is earned per task class through logged acceptance: the graduation ladder.</text>
</svg>
