<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 478" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">An invoice workflow the team can own</title>
  <desc id="desc">WEEKS 1–2. Map invoice queries. Name the owner and measure today.. WEEK 3. Build the check set. Use 30 past queries and their answers.. WEEKS 4–9. Run one use case. Agents draft. People approve.. WEEKS 10–13. Review and hand over. Operations runs one cycle unaided.. After sponsor approval, the next team starts with its own baseline.</desc>
  <rect width="960" height="478" rx="20" fill="#102132"/>
  <text x="36" y="38" fill="#9ee8d9" font-size="17" font-weight="700" letter-spacing="2">ENTERPRISE / FIRST 90 DAYS</text>
  <text x="36" y="83" fill="#ffffff" font-size="36" font-weight="700">An invoice workflow the team can own</text>
  <path d="M36 107H924" stroke="#3b5366"/>
  <g transform="translate(36 128)">
    <rect width="434" height="127" rx="13" fill="#20364b" stroke="#436079"/>
    <rect x="18" y="17" width="34" height="29" rx="6" fill="#9ee8d9"/>
    <text x="35" y="37" text-anchor="middle" fill="#102132" font-size="16" font-weight="700">01</text>
    <text x="64" y="37" fill="#9ee8d9" font-size="16" font-weight="700">WEEKS 1–2</text>
    <text x="18" y="75" fill="#ffffff" font-size="27" font-weight="700">Map invoice queries</text>
    <text x="18" y="105" fill="#e3edf5" font-size="18">Name the owner and measure today.</text>
  </g>
  <g transform="translate(490 128)">
    <rect width="434" height="127" rx="13" fill="#20364b" stroke="#436079"/>
    <rect x="18" y="17" width="34" height="29" rx="6" fill="#d7cafb"/>
    <text x="35" y="37" text-anchor="middle" fill="#102132" font-size="16" font-weight="700">02</text>
    <text x="64" y="37" fill="#d7cafb" font-size="16" font-weight="700">WEEK 3</text>
    <text x="18" y="75" fill="#ffffff" font-size="27" font-weight="700">Build the check set</text>
    <text x="18" y="105" fill="#e3edf5" font-size="18">Use 30 past queries and their answers.</text>
  </g>
  <g transform="translate(36 273)">
    <rect width="434" height="127" rx="13" fill="#20364b" stroke="#436079"/>
    <rect x="18" y="17" width="34" height="29" rx="6" fill="#f6d791"/>
    <text x="35" y="37" text-anchor="middle" fill="#102132" font-size="16" font-weight="700">03</text>
    <text x="64" y="37" fill="#f6d791" font-size="16" font-weight="700">WEEKS 4–9</text>
    <text x="18" y="75" fill="#ffffff" font-size="27" font-weight="700">Run one use case</text>
    <text x="18" y="105" fill="#e3edf5" font-size="18">Agents draft. People approve.</text>
  </g>
  <g transform="translate(490 273)">
    <rect width="434" height="127" rx="13" fill="#20364b" stroke="#436079"/>
    <rect x="18" y="17" width="34" height="29" rx="6" fill="#9ee8d9"/>
    <text x="35" y="37" text-anchor="middle" fill="#102132" font-size="16" font-weight="700">04</text>
    <text x="64" y="37" fill="#9ee8d9" font-size="16" font-weight="700">WEEKS 10–13</text>
    <text x="18" y="75" fill="#ffffff" font-size="27" font-weight="700">Review and hand over</text>
    <text x="18" y="105" fill="#e3edf5" font-size="18">Operations runs one cycle unaided.</text>
  </g>
  <text x="36" y="446" fill="#e3edf5" font-size="20">After sponsor approval, the next team starts with its own baseline.</text>
