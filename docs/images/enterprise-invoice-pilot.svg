<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Prove one invoice-query workflow</title>
  <desc id="desc">Map the baseline and assemble 30 historical examples. Operate one use case, Track results with a sponsor decision, then have operations complete one independent cycle before the next team scopes its pilot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#131023"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6B00DB"/></marker>
  </defs>
<rect x="0" y="0" width="960" height="540" fill="white" stroke="#d8d1e4" rx="20"/><rect x="36" y="33" width="8" height="21" fill="#6B00DB" stroke="none" rx="4"/><text x="55" y="50" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="start" font-weight="700">ENTERPRISE / WORKED EXAMPLE</text><text x="36" y="106" font-family="Poppins,Arial,sans-serif" font-size="42" fill="#131023" text-anchor="start" font-weight="700">Prove one invoice-query workflow</text><text x="38" y="142" font-family="Montserrat,Arial,sans-serif" font-size="20" fill="#494456" text-anchor="start" font-weight="400">A sponsor decides what happens next using the before-and-after evidence.</text><path d="M36 164H924" fill="none" stroke="#d8d1e4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M108 259H852" fill="none" stroke="#d8d1e4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="121" cy="259" r="54" fill="#fff4d7" stroke="none"/><g transform="translate(79 218) scale(0.84)"><rect x="20" y="11" width="55" height="76" fill="white" stroke="#131023" rx="5"/><path d="M33 33H62M33 45H62M33 57H54" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 66l8 8 15-17" fill="none" stroke="#F7B613" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="121" y="347" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Scope + test</text><text x="121" y="375" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Map the flow.</text><text x="121" y="399" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Use 30 past queries.</text><circle cx="360" cy="259" r="54" fill="#fff4d7" stroke="none"/><g transform="translate(318 218) scale(0.84)"><path d="M37 14h26m-19 0v25L24 69q-9 16 7 17h38q16-1 7-17L56 39V14" fill="white" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 70q12-9 24-4t17-3" fill="none" stroke="#F7B613" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="51" cy="51" r="4" fill="#F7B613" stroke="none"/></g><text x="360" y="347" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Operate</text><text x="360" y="375" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Try one use case.</text><text x="360" y="399" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">People approve.</text><circle cx="599" cy="259" r="54" fill="#fff4d7" stroke="none"/><g transform="translate(557 218) scale(0.84)"><path d="M16 21v58h69" fill="none" stroke="#131023" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M25 66l17-17 13 8 24-27" fill="none" stroke="#F7B613" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="79" cy="30" r="5" fill="#F7B613" stroke="none"/></g><text x="599" y="347" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Track</text><text x="599" y="375" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Compare to baseline.</text><text x="599" y="399" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Sponsor decides.</text><circle cx="838" cy="259" r="54" fill="#fff4d7" stroke="none"/><g transform="translate(796 218) scale(0.84)"><path d="M12 72l17-17 16 2 10-9 14 5 19-21m-76 40 10 12 17-18m29-12 12 10 12-15m-56-1 13-15 16 4 14-17" fill="none" stroke="#131023" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M43 62l10 8m-2-14 13 11" fill="none" stroke="#F7B613" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="838" y="347" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Own</text><text x="838" y="375" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Ops runs one cycle</text><text x="838" y="399" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">without the builders.</text><path d="M201 259h79" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><path d="M440 259h79" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><path d="M679 259h79" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><rect x="36" y="456" width="888" height="59" fill="#f1e8fc" stroke="none" rx="13"/><text x="56" y="493" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Next team</text><text x="266" y="493" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#131023" text-anchor="start" font-weight="400">Reuse the runbook. Start with its own Scope, baseline and decision owner.</text>
</svg>
