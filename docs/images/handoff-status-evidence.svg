<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">What makes the status change?</title>
  <desc id="desc">Prepared is a saved brief. Offered needs authorised dispatch. Accepted needs the named receiver to agree to the offered revision. Completed needs evidence of customer notification, the owner record update and the first action. Own needs a separate independent cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#131023"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6B00DB"/></marker>
  </defs>
<rect x="0" y="0" width="960" height="540" fill="white" stroke="#d8d1e4" rx="20"/><rect x="36" y="33" width="8" height="21" fill="#6B00DB" stroke="none" rx="4"/><text x="55" y="50" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="start" font-weight="700">CUSTOMER SUCCESS / HANDOFF</text><text x="36" y="106" font-family="Poppins,Arial,sans-serif" font-size="42" fill="#131023" text-anchor="start" font-weight="700">What makes the status change?</text><text x="38" y="142" font-family="Montserrat,Arial,sans-serif" font-size="20" fill="#494456" text-anchor="start" font-weight="400">Each step needs its own evidence. Save the receipt with the account.</text><path d="M36 164H924" fill="none" stroke="#d8d1e4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M108 259H850" fill="none" stroke="#d8d1e4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="121" cy="259" r="54" fill="#e4f8f2" stroke="none"/><g transform="translate(79 218) scale(0.84)"><rect x="20" y="11" width="55" height="76" fill="white" stroke="#131023" rx="5"/><path d="M33 33H62M33 45H62M33 57H54" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 66l8 8 15-17" fill="none" stroke="#1ABC9C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="121" y="347" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Prepared</text><text x="121" y="375" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Save the brief.</text><text x="121" y="399" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Current owner stays.</text><circle cx="360" cy="259" r="54" fill="#e4f8f2" stroke="none"/><g transform="translate(318 218) scale(0.84)"><rect x="12" y="23" width="76" height="52" fill="white" stroke="#131023" rx="6"/><path d="M14 27l36 29 36-29M14 71l27-23m45 23-27-23" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="76" cy="28" r="8" fill="#1ABC9C" stroke="none"/></g><text x="360" y="347" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Offered</text><text x="360" y="375" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Authorised dispatch</text><text x="360" y="399" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">has a receipt.</text><circle cx="599" cy="259" r="54" fill="#e4f8f2" stroke="none"/><g transform="translate(557 218) scale(0.84)"><path d="M12 72l17-17 16 2 10-9 14 5 19-21m-76 40 10 12 17-18m29-12 12 10 12-15m-56-1 13-15 16 4 14-17" fill="none" stroke="#131023" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M43 62l10 8m-2-14 13 11" fill="none" stroke="#1ABC9C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="599" y="347" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Accepted</text><text x="599" y="375" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Receiver accepts</text><text x="599" y="399" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">the offered revision.</text><circle cx="838" cy="259" r="54" fill="#e4f8f2" stroke="none"/><g transform="translate(796 218) scale(0.84)"><circle cx="50" cy="49" r="34" fill="white" stroke="#131023"/><circle cx="50" cy="49" r="23" fill="none" stroke="#131023"/><circle cx="50" cy="49" r="12" fill="none" stroke="#1ABC9C"/><path d="M50 49l35-33m-12 3 12-3-1 12" fill="none" stroke="#1ABC9C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="838" y="347" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Completed</text><text x="838" y="375" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Customer notified.</text><text x="838" y="399" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Owner record updated.</text><text x="838" y="423" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">First action evidenced.</text><path d="M201 259h79" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><path d="M440 259h79" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><path d="M679 259h79" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><rect x="36" y="456" width="888" height="59" fill="#f1e8fc" stroke="none" rx="13"/><text x="56" y="493" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Separate Own gate</text><text x="266" y="493" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#131023" text-anchor="start" font-weight="400">The receiving team runs a full cycle independently, with evidence.</text>
</svg>
