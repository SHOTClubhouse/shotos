<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 478" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">What changes the handoff status?</title>
  <desc id="desc">PREPARED. Save the brief. Link commitments and open issues. OFFERED. Record dispatch. An authorised offer reaches the receiver. ACCEPTED. Get written agreement. Confirm scope and first-action date. COMPLETED. Verify the first action. Check the notice and owner update. Own needs separate proof of an independent cycle.</desc>
  <rect width="960" height="478" rx="20" fill="#102132"/>
  <text x="36" y="38" fill="#9ee8d9" font-size="17" font-weight="700" letter-spacing="2">CUSTOMER SUCCESS / TRANSFER</text>
  <text x="36" y="83" fill="#ffffff" font-size="36" font-weight="700">What changes the handoff status?</text>
  <path d="M36 107H924" stroke="#3b5366"/>
  <g transform="translate(36 128)">
    <rect width="434" height="127" rx="13" fill="#20364b" stroke="#436079"/>
    <rect x="18" y="17" width="34" height="29" rx="6" fill="#9ee8d9"/>
    <text x="35" y="37" text-anchor="middle" fill="#102132" font-size="16" font-weight="700">01</text>
    <text x="64" y="37" fill="#9ee8d9" font-size="16" font-weight="700">PREPARED</text>
    <text x="18" y="75" fill="#ffffff" font-size="27" font-weight="700">Save the brief</text>
    <text x="18" y="105" fill="#e3edf5" font-size="18">Link commitments and open issues.</text>
  </g>
  <g transform="translate(490 128)">
    <rect width="434" height="127" rx="13" fill="#20364b" stroke="#436079"/>
    <rect x="18" y="17" width="34" height="29" rx="6" fill="#d7cafb"/>
    <text x="35" y="37" text-anchor="middle" fill="#102132" font-size="16" font-weight="700">02</text>
    <text x="64" y="37" fill="#d7cafb" font-size="16" font-weight="700">OFFERED</text>
    <text x="18" y="75" fill="#ffffff" font-size="27" font-weight="700">Record dispatch</text>
    <text x="18" y="105" fill="#e3edf5" font-size="18">An authorised offer reaches the receiver.</text>
  </g>
  <g transform="translate(36 273)">
    <rect width="434" height="127" rx="13" fill="#20364b" stroke="#436079"/>
    <rect x="18" y="17" width="34" height="29" rx="6" fill="#f6d791"/>
    <text x="35" y="37" text-anchor="middle" fill="#102132" font-size="16" font-weight="700">03</text>
    <text x="64" y="37" fill="#f6d791" font-size="16" font-weight="700">ACCEPTED</text>
    <text x="18" y="75" fill="#ffffff" font-size="27" font-weight="700">Get written agreement</text>
    <text x="18" y="105" fill="#e3edf5" font-size="18">Confirm scope and first-action date.</text>
  </g>
  <g transform="translate(490 273)">
    <rect width="434" height="127" rx="13" fill="#20364b" stroke="#436079"/>
    <rect x="18" y="17" width="34" height="29" rx="6" fill="#9ee8d9"/>
    <text x="35" y="37" text-anchor="middle" fill="#102132" font-size="16" font-weight="700">04</text>
    <text x="64" y="37" fill="#9ee8d9" font-size="16" font-weight="700">COMPLETED</text>
    <text x="18" y="75" fill="#ffffff" font-size="27" font-weight="700">Verify the first action</text>
    <text x="18" y="105" fill="#e3edf5" font-size="18">Check the notice and owner update.</text>
  </g>
  <text x="36" y="446" fill="#e3edf5" font-size="20">Own needs separate proof of an independent cycle.</text>
</svg>
