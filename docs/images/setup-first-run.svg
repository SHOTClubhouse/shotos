  <title id="title">Start where your team already works</title>
  <desc id="desc">CHAT OR MANUAL. Use the card. Copy the acceptance card.. AGENT PROJECT. Preview the install. Choose the runtime and open a new session.. LOCAL DEMO. Check a claim. Compare two reports about the same work.. REPEATABLE WORK. Add the skills you need. Pick a pack for work you repeat.. The same working agreement follows the work across these routes.</desc>
