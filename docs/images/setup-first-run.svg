<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to try it</title>
  <desc id="desc">Three independent starting points: an acceptance card in chat, a project install with selected packs, or a local claim-check demo.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#131023"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6B00DB"/></marker>
  </defs>
<rect x="0" y="0" width="960" height="540" fill="white" stroke="#d8d1e4" rx="20"/><rect x="36" y="33" width="8" height="21" fill="#6B00DB" stroke="none" rx="4"/><text x="55" y="50" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="start" font-weight="700">SHOTos / GET STARTED</text><text x="36" y="106" font-family="Poppins,Arial,sans-serif" font-size="42" fill="#131023" text-anchor="start" font-weight="700">Three ways to try it</text><text x="38" y="142" font-family="Montserrat,Arial,sans-serif" font-size="20" fill="#494456" text-anchor="start" font-weight="400">Start with the work you already have, in the tools you already use.</text><path d="M36 164H924" fill="none" stroke="#d8d1e4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="172" cy="264" r="54" fill="#f1e8fc" stroke="none"/><g transform="translate(130 223) scale(0.84)"><path d="M18 19h65v47H50L29 80V66H18z" fill="white" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 36h41M30 48h30" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="172" y="352" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Use the card</text><text x="172" y="380" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Paste the acceptance card</text><text x="172" y="404" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">into a chat.</text><circle cx="480" cy="264" r="54" fill="#e4f8f2" stroke="none"/><g transform="translate(438 223) scale(0.84)"><rect x="10" y="19" width="80" height="61" fill="white" stroke="#131023" rx="8"/><path d="M10 33h80m-64 12 10 8-10 8m18 2h15" fill="none" stroke="#1ABC9C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="480" y="352" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Install in a project</text><text x="480" y="380" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Pick your runtime and packs.</text><text x="480" y="404" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Open a fresh session.</text><circle cx="788" cy="264" r="54" fill="#fff4d7" stroke="none"/><g transform="translate(746 223) scale(0.84)"><rect x="20" y="11" width="55" height="76" fill="white" stroke="#131023" rx="5"/><path d="M33 33H62M33 45H62M33 57H54" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 66l8 8 15-17" fill="none" stroke="#F7B613" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="788" y="352" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Run the local demo</text><text x="788" y="380" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Compare two reports.</text><text x="788" y="404" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">See what the checker proves.</text><rect x="36" y="456" width="888" height="59" fill="#f1e8fc" stroke="none" rx="13"/><text x="56" y="493" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">One agreement</text><text x="266" y="493" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#131023" text-anchor="start" font-weight="400">Choose the route that fits your tools. Add packs as you need them.</text>
</svg>
