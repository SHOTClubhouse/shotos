<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How claim-check works</title>
  <desc id="d">An agent says it is done. claim-check reads the Claims block, tests each claim against files, commands, git and receipts, and marks each one supported, unsupported, no evidence or declared. The Stop hook sends the agent back if a claim fails.</desc>
  <rect width="960" height="400" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">How claim-check works</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <g transform="translate(24,76)">
    <rect width="270" height="250" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="135" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">The agent's report</text>
    <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#111827">
      <text x="16" y="62">"All done, tests pass,</text>
      <text x="16" y="80"> committed and emailed."</text>
      <text x="16" y="114">Claims:</text>
      <text x="16" y="134">- [file] created: summary.md</text>
      <text x="16" y="154">- [command] passes: unittest</text>
      <text x="16" y="174">- [git] committed: HEAD</text>
      <text x="16" y="194">- [external] sent: to finance</text>
      <text x="16" y="214">- [unverified] email layout</text>
    </g>
  </g>
  <g transform="translate(345,126)">
    <rect width="220" height="150" rx="12" fill="#111827"/>
    <text x="110" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">claim-check</text>
    <g font-size="13" fill="#d1d5db" text-anchor="middle">
      <text x="110" y="70">does the file exist?</text>
      <text x="110" y="90">run the allowed command</text>
      <text x="110" y="110">read the git state</text>
      <text x="110" y="130">is there a receipt?</text>
    </g>
  </g>
  <g transform="translate(616,76)" font-size="14">
    <rect width="320" height="250" rx="12" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="160" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">What is true</text>
    <rect x="16" y="52" width="110" height="24" rx="6" fill="#dcfce7"/><text x="71" y="69" text-anchor="middle" font-weight="700" fill="#15803d">SUPPORTED</text><text x="138" y="69" fill="#111827">file exists</text>
    <rect x="16" y="90" width="110" height="24" rx="6" fill="#fee2e2"/><text x="71" y="107" text-anchor="middle" font-weight="700" fill="#b91c1c">UNSUPPORTED</text><text x="138" y="107" fill="#111827">tests exit 1</text>
    <rect x="16" y="128" width="110" height="24" rx="6" fill="#fee2e2"/><text x="71" y="145" text-anchor="middle" font-weight="700" fill="#b91c1c">UNSUPPORTED</text><text x="138" y="145" fill="#111827">uncommitted changes</text>
    <rect x="16" y="166" width="110" height="24" rx="6" fill="#fef3c7"/><text x="71" y="183" text-anchor="middle" font-weight="700" fill="#b45309">NO EVIDENCE</text><text x="138" y="183" fill="#111827">no receipt for the send</text>
    <rect x="16" y="204" width="110" height="24" rx="6" fill="#e0f2fe"/><text x="71" y="221" text-anchor="middle" font-weight="700" fill="#0369a1">DECLARED</text><text x="138" y="221" fill="#111827">honest gap, kept visible</text>
  </g>
  <g stroke="#6b7280" stroke-width="2" marker-end="url(#a)"><line x1="296" y1="201" x2="343" y2="201"/><line x1="567" y1="201" x2="614" y2="201"/></g>
  <text x="480" y="366" text-anchor="middle" font-size="14" fill="#374151">With the Claude Code Stop hook, a failed claim sends the agent back to fix the work or correct the report.</text>
  <text x="480" y="388" text-anchor="middle" font-size="12" fill="#6b7280">Installed is not executed. Executed is not accepted. Only a person accepts.</text>
</svg>
