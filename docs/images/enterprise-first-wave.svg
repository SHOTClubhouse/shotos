<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">When can the next site start?</title>
  <desc id="description">In the fictional Redwood exercise, Central proves an independent cycle and Tomas conditionally approves East Yard as the first wave. East Yard can prepare, but it cannot start operating until its baseline, invoice policy and reviewer are confirmed.</desc>
  <defs>
    <style>
      .heading { font: 700 46px Poppins, Arial, sans-serif; fill: #131023; }
      .title { font: 700 28px Poppins, Arial, sans-serif; fill: #131023; }
      .label { font: 700 18px Poppins, Arial, sans-serif; letter-spacing: 1px; fill: #131023; }
      .body { font: 400 22px Montserrat, Arial, sans-serif; fill: #494456; }
      .inverse { fill: #fff; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1 8 4.5 1 8Z" fill="#6B00DB"/>
    </marker>
  </defs>
  <rect width="960" height="600" rx="24" fill="#fff" stroke="#d8d1e4"/>
  <rect x="48" y="42" width="7" height="21" rx="3" fill="#6B00DB"/>
  <text class="label" x="69" y="59">SHOTos / FICTIONAL ENTERPRISE EXERCISE</text>
  <text class="heading" x="48" y="126">When can the next</text>
  <text class="heading" x="48" y="183">site start?</text>

  <rect x="48" y="224" width="365" height="183" rx="18" fill="#f3eefb"/>
  <path d="M81 268h33l13 13v55H81z" fill="#fff" stroke="#6B00DB" stroke-width="3" stroke-linejoin="round"/>
  <path d="M114 268v14h13m-35 18h23m-23 12h14" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="151" y="274">FIRST SITE</text>
  <text class="title" x="151" y="311">Team runs it</text>
  <text class="body" x="81" y="373">Ellis runs it without help.</text>

  <path d="M426 315h79" fill="none" stroke="#6B00DB" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="526" y="224" width="386" height="183" rx="18" fill="#6B00DB"/>
  <circle cx="577" cy="302" r="22" fill="#fff"/>
  <path d="m567 303 7 7 12-16" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label inverse" x="622" y="274">NEXT SITE</text>
  <text class="title inverse" x="622" y="311">East Yard prepares</text>
  <text class="body inverse" x="558" y="373">Tomas decides when it starts.</text>

  <path d="M719 420v26" fill="none" stroke="#6B00DB" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="48" y="460" width="864" height="93" rx="18" fill="#f6f4f8" stroke="#d8d1e4"/>
  <text class="label" x="77" y="496">CHECK BEFORE STARTING</text>
  <text class="body" x="77" y="528">Record East Yard’s starting figures, invoice rules and reviewer.</text>
</svg>
