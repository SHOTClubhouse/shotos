<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Will employers fund the pilot?</title>
  <desc id="desc">Offer a paid pilot to ten HR leads. Three or more commitments trigger a cohort, two trigger five more conversations, and fewer than two return to Scope. A second coach proves independent ownership.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#131023"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6B00DB"/></marker>
  </defs>
<rect x="0" y="0" width="960" height="540" fill="white" stroke="#d8d1e4" rx="20"/><rect x="36" y="33" width="8" height="21" fill="#6B00DB" stroke="none" rx="4"/><text x="55" y="50" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="start" font-weight="700">FOUNDER / WORKED EXAMPLE</text><text x="36" y="106" font-family="Poppins,Arial,sans-serif" font-size="42" fill="#131023" text-anchor="start" font-weight="700">Will employers fund the pilot?</text><text x="38" y="142" font-family="Montserrat,Arial,sans-serif" font-size="20" fill="#494456" text-anchor="start" font-weight="400">Agree the demand threshold before you commit to delivering a cohort.</text><path d="M36 164H924" fill="none" stroke="#d8d1e4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="151" cy="251" r="54" fill="#f1e8fc" stroke="none"/><g transform="translate(109 210) scale(0.84)"><path d="M18 19h65v47H50L29 80V66H18z" fill="white" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 36h41M30 48h30" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="151" y="339" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Talk to buyers</text><text x="151" y="367" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">10 HR leads hear</text><text x="151" y="391" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">the paid pilot offer.</text><path d="M221 250H304" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><text x="326" y="220" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#131023" text-anchor="start" font-weight="700">PAID COMMITMENTS</text><rect x="327" y="235" width="102" height="35" fill="#e4f8f2" stroke="none" rx="17"/><text x="378.0" y="258" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="middle" font-weight="700">3 or more</text><text x="445" y="258" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Run one cohort</text><rect x="327" y="282" width="102" height="35" fill="#fff4d7" stroke="none" rx="17"/><text x="378.0" y="305" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="middle" font-weight="700">2</text><text x="445" y="305" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Speak to five more leads</text><rect x="327" y="329" width="102" height="35" fill="#f1e8fc" stroke="none" rx="17"/><text x="378.0" y="352" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="middle" font-weight="700">0 or 1</text><text x="445" y="352" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Return to Scope</text><path d="M640 250H706" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><circle cx="812" cy="251" r="54" fill="#e4f8f2" stroke="none"/><g transform="translate(770 210) scale(0.84)"><circle cx="49" cy="29" r="15" fill="white" stroke="#131023"/><path d="M21 78q0-26 28-26t28 26z" fill="white" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 67h28" fill="none" stroke="#1ABC9C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="812" y="339" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Second coach</text><text x="812" y="367" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Runs a full cycle</text><text x="812" y="391" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">independently.</text><rect x="36" y="456" width="888" height="59" fill="#f1e8fc" stroke="none" rx="13"/><text x="56" y="493" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Track the cohort</text><text x="266" y="493" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#131023" text-anchor="start" font-weight="400">Check attendance, before-and-after self-assessment and renewal.</text>
</svg>
