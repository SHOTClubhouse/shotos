<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 478" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">From conversations to a paid cohort</title>
  <desc id="desc">SCOPE. Talk to both sides. 10 first-time managers and 10 HR leads.. HYPOTHESISE. Set a buying signal. Seek 3 paid pilot commitments.. OPERATE + TRACK. Run one cohort. Check attendance, assessment and renewal.. OWN. Prepare the next coach. Write a runbook for the next cohort.. Illustrative coaching business. Commitments and renewal are measures to check.</desc>
