<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The SHOTos work loop</title>
  <desc id="d">Five steps in order: Brief, Build, Check, Hand over, Improve. After Check a named person decides to hand over, change course back to Brief, or stop. The four rules run underneath every step.</desc>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">The SHOTos work loop: five steps, four rules inside every one</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <g font-size="14" text-anchor="middle">
    <g transform="translate(30,80)">
      <rect width="160" height="110" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
      <text x="80" y="48" font-size="24" font-weight="800" fill="#0369a1">Brief</text>
      <text x="80" y="80" fill="#374151">Agree what done is</text>
    </g>
    <g transform="translate(217,80)">
      <rect width="160" height="110" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
      <text x="80" y="48" font-size="24" font-weight="800" fill="#15803d">Build</text>
      <text x="80" y="80" fill="#374151">Make a small real piece</text>
    </g>
    <g transform="translate(404,80)">
      <rect width="160" height="110" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
      <text x="80" y="48" font-size="24" font-weight="800" fill="#b45309">Check</text>
      <text x="80" y="80" fill="#374151">Measure, then decide</text>
    </g>
    <g transform="translate(591,80)">
      <rect width="160" height="110" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
      <text x="80" y="48" font-size="24" font-weight="800" fill="#b91c1c">Hand over</text>
      <text x="80" y="80" fill="#374151">Pass it on, proven</text>
    </g>
    <g transform="translate(778,80)">
      <rect width="160" height="110" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
      <text x="80" y="48" font-size="24" font-weight="800" fill="#374151">Improve</text>
      <text x="80" y="80" fill="#374151">Learn, then repeat</text>
    </g>
  </g>
  <g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="190" y1="135" x2="215" y2="135"/>
    <line x1="377" y1="135" x2="402" y2="135"/>
    <line x1="564" y1="135" x2="589" y2="135"/>
    <line x1="751" y1="135" x2="776" y2="135"/>
    <path d="M484,190 C484,245 110,245 110,193"/>
  </g>
  <text x="297" y="262" text-anchor="middle" font-size="13" fill="#6b7280">change course: back to Brief</text>
  <text x="496" y="214" text-anchor="start" font-size="13" fill="#6b7280">or stop: record why, and close</text>
  <rect x="30" y="290" width="905" height="104" rx="12" fill="#111827"/>
  <text x="482" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Inside every step, on every agent task</text>
  <g font-size="15" text-anchor="middle" fill="#f9fafb">
    <text x="143" y="358">1 Stop at the boundaries</text>
    <text x="370" y="358">2 Hold to the agreed acceptance</text>
    <text x="597" y="358">3 Observe the real result</text>
    <text x="824" y="358">4 Tell only what you can show</text>
  </g>
  <text x="482" y="382" text-anchor="middle" font-size="12" fill="#9ca3af">Each step ends with an exit check.</text>
</svg>
