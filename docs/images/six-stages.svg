<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">From problem to a team that owns it</title>
  <desc id="desc">Six stages. After checking results, hand over, try a different idea, wait for more information or stop. Each new team starts with its own problem.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#131023"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6B00DB"/></marker>
  </defs>
<rect x="0" y="0" width="960" height="540" fill="white" stroke="#d8d1e4" rx="20"/><rect x="36" y="33" width="8" height="21" fill="#6B00DB" stroke="none" rx="4"/><text x="55" y="50" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="start" font-weight="700">SHOTos / THE METHOD</text><text x="36" y="106" font-family="Poppins,Arial,sans-serif" font-size="42" fill="#131023" text-anchor="start" font-weight="700">From problem to a team that owns it</text><text x="38" y="142" font-family="Montserrat,Arial,sans-serif" font-size="20" fill="#494456" text-anchor="start" font-weight="400">Use one stage for a task, or follow all six to roll out a change.</text><path d="M36 164H924" fill="none" stroke="#d8d1e4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M78 250H880" fill="none" stroke="#d8d1e4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="88" cy="250" r="43" fill="#f1e8fc" stroke="none"/><g transform="translate(56 218) scale(0.64)"><path d="M9 25l25-9 28 10 25-9v53l-25 9-28-10-25 9z" fill="white" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M34 16v53m28-43v53" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M20 48l18-11 18 17 16-14" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="73" cy="39" r="5" fill="#6B00DB" stroke="none"/></g><text x="88" y="318" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="middle" font-weight="700">Scope</text><circle cx="241" cy="250" r="43" fill="#f1e8fc" stroke="none"/><g transform="translate(209 218) scale(0.64)"><circle cx="50" cy="49" r="34" fill="white" stroke="#131023"/><circle cx="50" cy="49" r="23" fill="none" stroke="#131023"/><circle cx="50" cy="49" r="12" fill="none" stroke="#6B00DB"/><path d="M50 49l35-33m-12 3 12-3-1 12" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="241" y="318" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="middle" font-weight="700">Hypothesise</text><circle cx="394" cy="250" r="43" fill="#f1e8fc" stroke="none"/><g transform="translate(362 218) scale(0.64)"><path d="M37 14h26m-19 0v25L24 69q-9 16 7 17h38q16-1 7-17L56 39V14" fill="white" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 70q12-9 24-4t17-3" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="51" cy="51" r="4" fill="#6B00DB" stroke="none"/></g><text x="394" y="318" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="middle" font-weight="700">Operate</text><circle cx="547" cy="250" r="43" fill="#fff4d7" stroke="none"/><g transform="translate(515 218) scale(0.64)"><path d="M16 21v58h69" fill="none" stroke="#131023" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M25 66l17-17 13 8 24-27" fill="none" stroke="#6B00DB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="79" cy="30" r="5" fill="#6B00DB" stroke="none"/></g><text x="547" y="318" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="middle" font-weight="700">Track</text><circle cx="700" cy="250" r="43" fill="#f1e8fc" stroke="none"/><g transform="translate(668 218) scale(0.64)"><path d="M12 72l17-17 16 2 10-9 14 5 19-21m-76 40 10 12 17-18m29-12 12 10 12-15m-56-1 13-15 16 4 14-17" fill="none" stroke="#131023" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M43 62l10 8m-2-14 13 11" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="700" y="318" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="middle" font-weight="700">Own</text><circle cx="853" cy="250" r="43" fill="#f1e8fc" stroke="none"/><g transform="translate(821 218) scale(0.64)"><path d="M21 76V61h16v15m6 0V47h16v29m6 0V31h16v45M14 78h73" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M19 47l20-14 14 4 27-23m-13 0h13v13" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="853" y="318" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="middle" font-weight="700">Sustain</text><text x="853" y="342" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="middle" font-weight="700">and Scale</text><path d="M592 250H652" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><text x="622" y="220" font-family="Poppins,Arial,sans-serif" font-size="15" fill="#131023" text-anchor="middle" font-weight="700">Proceed</text><path d="M547 327V364H339m208 0h219" fill="none" stroke="#6B00DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M339 364H241V333" fill="none" stroke="#6B00DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><rect x="330" y="372" width="135" height="35" fill="#f1e8fc" stroke="none" rx="17"/><text x="397.5" y="395" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="middle" font-weight="700">Try a new idea</text><rect x="472" y="372" width="124" height="35" fill="#fff4d7" stroke="none" rx="17"/><text x="534.0" y="395" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="middle" font-weight="700">Wait for facts</text><rect x="606" y="372" width="159" height="35" fill="#f1e8fc" stroke="none" rx="17"/><text x="685.5" y="395" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="middle" font-weight="700">Stop and say why</text><rect x="36" y="456" width="888" height="59" fill="#f1e8fc" stroke="none" rx="13"/><text x="56" y="493" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Bring in the next team</text><text x="290" y="493" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#131023" text-anchor="start" font-weight="400">Check the first team can run it alone. Measure again at each new site.</text>
</svg>
