<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Take one repeat question off your plate</title>
  <desc id="desc">A bakery counts repeat allergy questions, verifies the ingredients page, drafts a week of posts, then counts allergy questions again to decide what to do.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#131023"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6B00DB"/></marker>
  </defs>
<rect x="0" y="0" width="960" height="540" fill="white" stroke="#d8d1e4" rx="20"/><rect x="36" y="33" width="8" height="21" fill="#6B00DB" stroke="none" rx="4"/><text x="55" y="50" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="start" font-weight="700">SMALL BUSINESS / WORKED EXAMPLE</text><text x="36" y="106" font-family="Poppins,Arial,sans-serif" font-size="42" fill="#131023" text-anchor="start" font-weight="700">Take one repeat question off your plate</text><text x="38" y="142" font-family="Montserrat,Arial,sans-serif" font-size="20" fill="#494456" text-anchor="start" font-weight="400">The assistant drafts. The owner checks. The next count tells you what changed.</text><path d="M36 164H924" fill="none" stroke="#d8d1e4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(54 198) scale(1.72)"><path d="M19 36h62v47H19z M12 38l13-21h50l13 21z" fill="white" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M31 83V59h16v24m12-26h12v14H59z" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M22 37h56" fill="none" stroke="#6B00DB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="140" y="390" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#131023" text-anchor="middle" font-weight="700">A bakery’s first month</text><circle cx="305" cy="206" r="17" fill="#1ABC9C" stroke="none"/><text x="305" y="212" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#131023" text-anchor="middle" font-weight="700">1</text><text x="338" y="213" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#131023" text-anchor="start" font-weight="700">Count repeat questions</text><text x="338" y="237" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="start" font-weight="400">Record the first week’s allergy enquiries.</text><circle cx="305" cy="262" r="17" fill="#1ABC9C" stroke="none"/><text x="305" y="268" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#131023" text-anchor="middle" font-weight="700">2</text><text x="338" y="269" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#131023" text-anchor="start" font-weight="700">Check the ingredients page</text><text x="338" y="293" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="start" font-weight="400">The owner verifies every allergen.</text><circle cx="305" cy="318" r="17" fill="#1ABC9C" stroke="none"/><text x="305" y="324" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#131023" text-anchor="middle" font-weight="700">3</text><text x="338" y="325" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#131023" text-anchor="start" font-weight="700">Draft the week’s posts</text><text x="338" y="349" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="start" font-weight="400">Use real shop updates. The owner posts.</text><circle cx="305" cy="374" r="17" fill="#1ABC9C" stroke="none"/><text x="305" y="380" font-family="Poppins,Arial,sans-serif" font-size="17" fill="#131023" text-anchor="middle" font-weight="700">4</text><text x="338" y="381" font-family="Poppins,Arial,sans-serif" font-size="20" fill="#131023" text-anchor="start" font-weight="700">Count again and decide</text><text x="338" y="405" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="start" font-weight="400">Keep the page, change it or drop it.</text><rect x="36" y="456" width="888" height="59" fill="#f1e8fc" stroke="none" rx="13"/><text x="56" y="493" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Start with a count</text><text x="266" y="493" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#131023" text-anchor="start" font-weight="400">The same weekly measure shows whether the change helped.</text>
</svg>
