<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A checked draft is one kind of proof</title>
  <desc id="desc">Seven of twelve were repeat repair emails. Five drafts were prepared and one was parked. Track holds for an authorised run, a comparable sample and guard checks. The proposed target is 40 percent or fewer.</desc>
