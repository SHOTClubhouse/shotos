<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Win the work, then do the work</title>
  <desc id="d">The LEAP pipeline: Lead, Explore, Agree, Plan. NUDGE qualifies each opportunity during Explore and Agree. Plan hands the agreed work over to SHOTos Scope.</desc>
  <rect width="960" height="330" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Win the work with LEAP, then do it with SHOTos</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <g font-size="13" text-anchor="middle">
    <g transform="translate(24,80)"><rect width="150" height="110" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
      <text x="75" y="34" font-size="20" font-weight="800" fill="#0369a1">Lead</text><text x="75" y="62" fill="#374151">warm, cold,</text><text x="75" y="80" fill="#374151">target</text></g>
    <g transform="translate(196,80)"><rect width="150" height="110" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
      <text x="75" y="34" font-size="20" font-weight="800" fill="#6d28d9">Explore</text><text x="75" y="62" fill="#374151">meeting, discovery,</text><text x="75" y="80" fill="#374151">define</text></g>
    <g transform="translate(368,80)"><rect width="150" height="110" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
      <text x="75" y="34" font-size="20" font-weight="800" fill="#b45309">Agree</text><text x="75" y="62" fill="#374151">proposal, statement</text><text x="75" y="80" fill="#374151">of work, gatekeepers</text></g>
    <g transform="translate(540,80)"><rect width="150" height="110" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
      <text x="75" y="34" font-size="20" font-weight="800" fill="#15803d">Plan</text><text x="75" y="62" fill="#374151">start date, handover,</text><text x="75" y="80" fill="#374151">delivery</text></g>
    <g transform="translate(756,80)"><rect width="180" height="110" rx="12" fill="#111827"/>
      <text x="90" y="40" font-size="20" font-weight="800" fill="#ffffff">SHOTos</text><text x="90" y="66" fill="#d1d5db">starts at Scope</text><text x="90" y="84" fill="#d1d5db">problem and baseline</text></g>
  </g>
  <g stroke="#6b7280" stroke-width="2" marker-end="url(#a)">
    <line x1="174" y1="135" x2="194" y2="135"/><line x1="346" y1="135" x2="366" y2="135"/><line x1="518" y1="135" x2="538" y2="135"/><line x1="690" y1="135" x2="754" y2="135"/>
  </g>
  <text x="722" y="124" text-anchor="middle" font-size="12" fill="#6b7280">handover</text>
  <rect x="196" y="216" width="322" height="86" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="357" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">NUDGE qualifies the opportunity</text>
  <text x="357" y="266" text-anchor="middle" font-size="13" fill="#374151">Numbers · Understand · Definition</text>
  <text x="357" y="286" text-anchor="middle" font-size="13" fill="#374151">Gatekeepers · Elevate</text>
</svg>
