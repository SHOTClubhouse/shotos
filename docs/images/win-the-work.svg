<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Give the buyer a decision they can make</title>
  <desc id="desc">The school-bike example prices 120 bikes at £38 each, with parts at cost. The working sheet holds unsourced repair counts, a photo with unconfirmed rights and proposed commitments pending approval.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#131023"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6B00DB"/></marker>
  </defs>
<rect x="0" y="0" width="960" height="540" fill="white" stroke="#d8d1e4" rx="20"/><rect x="36" y="33" width="8" height="21" fill="#6B00DB" stroke="none" rx="4"/><text x="55" y="50" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="start" font-weight="700">WIN THE WORK / WORKED PROPOSAL</text><text x="36" y="106" font-family="Poppins,Arial,sans-serif" font-size="42" fill="#131023" text-anchor="start" font-weight="700">Give the buyer a decision they can make</text><text x="38" y="142" font-family="Montserrat,Arial,sans-serif" font-size="20" fill="#494456" text-anchor="start" font-weight="400">Build the case for the named reader. Keep the proof beside the draft.</text><path d="M36 164H924" fill="none" stroke="#d8d1e4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="139" cy="253" r="54" fill="#f1e8fc" stroke="none"/><g transform="translate(97 212) scale(0.84)"><circle cx="24" cy="66" r="17" fill="white" stroke="#131023"/><circle cx="77" cy="66" r="17" fill="white" stroke="#131023"/><path d="M24 66l15-28 17 27H24l20-26h24l9 27m-9-27-3-10h13m-47 8h14" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="56" cy="65" r="5" fill="#6B00DB" stroke="none"/></g><text x="139" y="341" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#131023" text-anchor="middle" font-weight="700">Reader’s decision</text><text x="139" y="369" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">Is per-bike servicing right</text><text x="139" y="393" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="middle" font-weight="400">for our schools?</text><path d="M216 253H303" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><rect x="326" y="196" width="265" height="171" fill="white" stroke="#d8d1e4" rx="9"/><rect x="344" y="202" width="106" height="35" fill="#e4f8f2" stroke="none" rx="17"/><text x="397.0" y="225" font-family="Poppins,Arial,sans-serif" font-size="16" fill="#131023" text-anchor="middle" font-weight="700">SLIDE COPY</text><text x="346" y="271" font-family="Poppins,Arial,sans-serif" font-size="29" fill="#131023" text-anchor="start" font-weight="700">120 bikes × £38</text><text x="347" y="306" font-family="Montserrat,Arial,sans-serif" font-size="21" fill="#131023" text-anchor="start" font-weight="400">£4,560 at full volume</text><text x="347" y="339" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#494456" text-anchor="start" font-weight="400">Parts at cost</text><path d="M608 253H662" fill="none" stroke="#6B00DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet)"/><g transform="translate(658 203) scale(1.0)"><rect x="20" y="11" width="55" height="76" fill="white" stroke="#131023" rx="5"/><path d="M33 33H62M33 45H62M33 57H54" fill="none" stroke="#131023" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 66l8 8 15-17" fill="none" stroke="#6B00DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="744" y="235" font-family="Poppins,Arial,sans-serif" font-size="21" fill="#131023" text-anchor="start" font-weight="700">Working sheet</text><text x="744" y="267" font-family="Montserrat,Arial,sans-serif" font-size="16" fill="#494456" text-anchor="start" font-weight="400">2,000 repairs: unsourced</text><text x="744" y="289" font-family="Montserrat,Arial,sans-serif" font-size="16" fill="#494456" text-anchor="start" font-weight="400">Photo: rights unconfirmed</text><text x="744" y="311" font-family="Montserrat,Arial,sans-serif" font-size="16" fill="#494456" text-anchor="start" font-weight="400">Promise: approval pending</text><rect x="36" y="456" width="888" height="59" fill="#f1e8fc" stroke="none" rx="13"/><text x="56" y="493" font-family="Poppins,Arial,sans-serif" font-size="19" fill="#131023" text-anchor="start" font-weight="700">Ready for review</text><text x="266" y="493" font-family="Montserrat,Arial,sans-serif" font-size="18" fill="#131023" text-anchor="start" font-weight="400">Check the render and obtain send approval separately.</text>
</svg>
